name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd /srv/vibedinsight
            # Sync first so the latest deploy.sh runs (the checkout is a
            # deploy target; local edits must never block a deploy)
            git fetch origin
            git reset --hard origin/main
            ./deploy.sh update

name: CI

on:
  push:
    branches: [main, 'rework/**']
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze code
        working-directory: app
        run: flutter analyze

      - name: Run tests
        working-directory: app
        run: flutter test

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vibedinsight
          POSTGRES_PASSWORD: vibedinsight
          POSTGRES_DB: vibedinsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibedinsight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/ tests/

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://vibedinsight:vibedinsight@localhost:5432/vibedinsight
        run: pytest -v 2>&1 | tee pytest-output.txt; exit ${PIPESTATUS[0]}

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-output
          path: backend/pytest-output.txt

      - name: Type check with mypy
        working-directory: backend
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true

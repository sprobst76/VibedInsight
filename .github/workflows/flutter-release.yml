name: Flutter Release (Play Store + APK)

# Push a tag like v0.4.3 to build a signed AAB + APK.
# - AAB and APK are always attached to a GitHub Release (AAB = for the first
#   MANUAL Play Console upload; APK = sideload).
# - If the PLAY_SERVICE_ACCOUNT_JSON secret is set, the AAB is also uploaded to
#   the Play Internal Testing track automatically (works from the 2nd release on,
#   once the app exists in Play Console).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track (internal/alpha/beta/production)'
        required: false
        default: 'internal'

env:
  # Empty unless the secret is set; used to gate the Play upload step.
  HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

jobs:
  release:
    name: Build signed AAB/APK + release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Write key.properties
        working-directory: app/android
        run: |
          cat > key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed AAB
        working-directory: app
        run: flutter build appbundle --release

      - name: Build signed APK (sideload)
        working-directory: app
        run: flutter build apk --release

      - name: Rename artifacts
        run: |
          V="${{ github.event.inputs.version || github.ref_name }}"
          cp app/build/app/outputs/bundle/release/app-release.aab "vibedinsight-${V}.aab"
          cp app/build/app/outputs/flutter-apk/app-release.apk "vibedinsight-${V}.apk"

      - name: Upload to Play Internal Testing
        if: env.HAS_PLAY_SA != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vibedinsight.app
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: GitHub Release (AAB + APK)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: VibedInsight ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## VibedInsight ${{ github.event.inputs.version || github.ref_name }}

            - **`vibedinsight-*.aab`** — signiertes App Bundle für den Play Store
              (erster Upload manuell in der Play Console, danach automatisch).
            - **`vibedinsight-*.apk`** — signierte APK zum Sideloaden.

            Requires the VibedInsight backend running on your server.
          files: |
            vibedinsight-*.aab
            vibedinsight-*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

name: Deploy to VPS

# Runs on a host-mode act_runner on the VPS (label "vibedinsight"), no inbound SSH needed.
# Same pattern as pv-planner; see ops/GITEA-DEPLOY.md.
# Stage 1: manual trigger only. Cutover = enable the push trigger below and
# switch .github/workflows/deploy.yml to workflow_dispatch (never both at once).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check (no changes) or deploy"
        default: check
  # push:
  #   branches: [main]
  #   paths:            # app-only pushes need no backend deploy
  #     - 'backend/**'
  #     - 'deploy.sh'
  #     - '.gitea/workflows/deploy.yml'

concurrency:
  group: vibedinsight-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: vibedinsight   # label of the VPS runner (host mode)
    timeout-minutes: 25
    steps:
      - name: Sanity check
        run: |
          cd /srv/vibedinsight
          echo "host: $(hostname), user: $(id -un)"
          docker compose -f backend/docker-compose.yml ps
          git remote get-url origin

      - name: Deploy
        if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
        run: |
          cd /srv/vibedinsight
          # Deploy target: local edits must never block a deploy
          git fetch origin
          git reset --hard origin/main
          ./deploy.sh update
